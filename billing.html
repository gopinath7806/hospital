<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing · Hospital Management</title>
<style>
:root{--bg:#eef4f3;--panel:#fff;--ink:#14282c;--mut:#5b7176;--line:#dbe5e6;--deep:#0e3b3f;--brand:#0f6b68;--bad:#c2402f;--ok:#1c7a4c;--hov:#f5f9f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--deep);color:#d5e6e4;padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1.5rem}
.brand{font-size:1.15rem;font-weight:600;line-height:1.2;color:#fff;padding:0 .5rem}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{color:inherit;text-decoration:none;padding:.55rem .75rem;border-radius:6px}
.side nav a:hover{background:rgba(255,255,255,.08)}
.side nav a.on{background:#fff;color:#0e3b3f;font-weight:600}
.main{padding:1.75rem 2rem 3rem;min-width:0}
h1{font-size:1.5rem;margin:0;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.head>div{display:flex;gap:.6rem;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.25rem}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.85rem;color:var(--mut);padding:.5rem .75rem;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:.65rem .75rem;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hov)}
.act{white-space:nowrap;text-align:right}
.mut{color:var(--mut)}
.tag{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.8rem;border:1px solid var(--ok);color:var(--ok)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.btn{font:inherit;padding:.5rem 1rem;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:.25rem .7rem;font-size:.85rem;border-color:var(--brand);color:var(--brand);margin-right:.25rem}
.btn.sm:hover{background:var(--brand);color:#fff}
.lk{font:inherit;background:none;border:0;color:var(--brand);cursor:pointer;padding:.2rem .4rem}
.lk:hover{text-decoration:underline}.lk.bad{color:var(--bad)}
input,select{font:inherit;padding:.5rem .65rem;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
input[type=search]{width:220px}
:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
dialog{border:0;border-radius:10px;padding:0;width:min(480px,calc(100vw - 2rem));box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(5,30,32,.55)}
form{padding:1.4rem;display:flex;flex-direction:column;gap:.85rem}
h2{font-size:1.05rem;margin:0}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.9rem;font-weight:500}
.fa{display:flex;justify-content:flex-end;gap:.5rem}
.err{color:var(--bad);margin:0;min-height:1.2em;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--deep);color:#fff;padding:.6rem 1rem;border-radius:6px;display:none;z-index:9}

/* Invoice: hidden on screen, shown only when printing a bill */
#invoice{display:none}
.inv{max-width:720px;margin:0 auto;color:#000;font-size:14px}
.inv h1{font-size:1.6rem}
.inv .ih{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:.8rem;margin-bottom:1rem}
.inv table{margin:1.2rem 0}
.inv th,.inv td{color:#000;border-bottom:1px solid #999;padding:.5rem .4rem}
.inv .r{text-align:right}
.inv .sig{margin-top:4rem;border-top:1px solid #000;width:220px;padding-top:.3rem}

@media(max-width:820px){.app{grid-template-columns:1fr}.side{padding:.75rem 1rem;gap:.5rem}.side nav{flex-direction:row;overflow-x:auto}.main{padding:1.25rem 1rem 2rem}}
@media print{
  body{background:#fff}
  .side,.head>div,#toast{display:none!important}
  .app{display:block}.main{padding:0}
  .panel{border:0;padding:0}
  .ls th:last-child,.ls td:last-child{display:none}
  body.pi .app{display:none}
  body.pi #invoice{display:block}
}
</style>
</head>
<body data-page="bills">
<div class="app">
  <aside class="side">
    <div class="brand">Hospital<br>Management</div>
    <nav id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="invoice"></div>
<dialog id="dlg"><form id="fm"></form></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db;try{db=JSON.parse(localStorage.getItem('hms'))}catch(e){}
db=db||{patients:[],doctors:[],appointments:[],bills:[],n:1};
db.bills=db.bills||[];db.patients=db.patients||[];
const save=()=>{try{localStorage.setItem('hms',JSON.stringify(db))}catch(e){}};
const money=n=>'₹'+(+n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>d.toLocaleDateString('en-CA');
const pname=id=>(db.patients.find(x=>x.id==id)||{}).name||'(deleted)';
const NAV=[['index.html','Dashboard'],['patients.html','Patients'],['doctors.html','Doctors'],['appointments.html','Appointments'],['billing.html','Billing']];

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2400)}

function render(){
  $('#nav').innerHTML=NAV.map(([h,l])=>`<a href="${h}" class="${h=='billing.html'?'on':''}">${l}</a>`).join('');
  const rows=[...db.bills].reverse();
  const unpaid=db.bills.filter(b=>b.status=='Unpaid').reduce((s,b)=>s+ +b.amount,0);
  $('#main').innerHTML=`<div class="head"><h1>Billing <span class="mut" style="font-size:1rem;font-weight:400">${money(unpaid)} unpaid</span></h1>
    <div><input type="search" id="q" placeholder="Search bills" aria-label="Search bills">
    <button class="btn" data-a="printlist">Print list</button>
    <button class="btn p" data-a="add">Create bill</button></div></div>
    <section class="panel">`+(rows.length?`<div class="sc"><table class="ls"><thead><tr><th>Bill</th><th>Date</th><th>Patient</th><th>Description</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(b=>`<tr>
      <td>#${String(b.id).padStart(4,'0')}</td><td>${esc(b.date||'')}</td><td>${esc(pname(b.patient))}</td><td>${esc(b.desc)}</td><td>${money(b.amount)}</td>
      <td><span class="tag ${b.status=='Paid'?'':'bad'}">${esc(b.status)}</span></td>
      <td class="act"><button class="btn sm" data-a="invoice" data-id="${b.id}">Print invoice</button>${b.status=='Unpaid'?`<button class="lk" data-a="pay" data-id="${b.id}">Mark paid</button>`:''}<button class="lk bad" data-a="del" data-id="${b.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`
    :`<p class="mut">No bills yet. Use Create bill to add the first one.</p>`)+`</section>`;
  const q=$('#q');
  if(q)q.oninput=()=>{const s=q.value.toLowerCase().trim();document.querySelectorAll('tbody tr').forEach(tr=>tr.hidden=s&&!tr.textContent.toLowerCase().includes(s))};
}

function printInvoice(id){
  const b=db.bills.find(x=>x.id==id);if(!b)return;
  const p=db.patients.find(x=>x.id==b.patient)||{};
  const d=new Date((b.date||iso(new Date()))+'T00:00:00');
  $('#invoice').innerHTML=`<div class="inv">
    <div class="ih"><div><h1>Hospital Management</h1><div>Patient invoice</div></div>
    <div class="r"><b>Invoice #${String(b.id).padStart(4,'0')}</b><br>${(isNaN(d)?new Date():d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div></div>
    <div><b>Billed to</b><br>${esc(p.name||'(deleted patient)')}<br>${p.age!==undefined?`Age ${esc(p.age)}, ${esc(p.gender)}<br>`:''}${esc(p.phone)}</div>
    <table><thead><tr><th>Description</th><th class="r">Amount</th></tr></thead>
    <tbody><tr><td>${esc(b.desc)}</td><td class="r">${money(b.amount)}</td></tr></tbody>
    <tfoot><tr><th>Total</th><th class="r">${money(b.amount)}</th></tr></tfoot></table>
    <p>Payment status: <b>${esc(b.status)}</b></p>
    <div class="sig">Authorised signature</div></div>`;
  document.body.classList.add('pi');
  window.print();
}
window.addEventListener('afterprint',()=>document.body.classList.remove('pi'));

function openForm(){
  if(!db.patients.length)return toast('Add a patient first on the Patients page.');
  $('#fm').innerHTML=`<h2>Create bill</h2>
    <label>Patient<select name="patient" required><option value="">Select patient</option>${db.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>
    <label>Description<input name="desc" required maxlength="255" placeholder="Consultation, X-ray, room charges"></label>
    <label>Amount (₹)<input type="number" name="amount" min="0.01" step="0.01" required></label>
    <div class="fa"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn p">Create bill</button></div>`;
  $('#dlg').showModal();
}
$('#fm').onsubmit=ev=>{
  ev.preventDefault();
  const d=Object.fromEntries(new FormData(ev.target));
  db.bills.push({id:db.n++,patient:d.patient,desc:d.desc.trim(),amount:d.amount,status:'Unpaid',date:iso(new Date())});
  save();$('#dlg').close();render();toast('Bill created.');
};
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a=='add')openForm();
  else if(a=='close')$('#dlg').close();
  else if(a=='invoice')printInvoice(id);
  else if(a=='printlist')window.print();
  else if(a=='pay'){db.bills.find(x=>x.id==id).status='Paid';save();render();toast('Bill marked as paid.')}
  else if(a=='del'&&confirm('Delete this bill?')){db.bills=db.bills.filter(x=>x.id!=id);save();render();toast('Bill deleted.')}
});
render();
</script>
</body>
</html>
