<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospital Management System</title>
<style>
:root{--bg:#eef4f3;--panel:#fff;--ink:#14282c;--mut:#5b7176;--line:#dbe5e6;--deep:#0e3b3f;--brand:#0f6b68;--bad:#c2402f;--ok:#1c7a4c;--field:#fff;--soft:#d3e6e4;--hov:#f5f9f9;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0c181a;--panel:#142428;--ink:#e3eeed;--mut:#93a9ad;--line:#26393d;--deep:#081c1e;--brand:#3fb3ae;--bad:#f0806f;--ok:#58c68c;--field:#0f1d20;--soft:#24474a;--hov:#192d31;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--deep);color:#d5e6e4;padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1.5rem}
@media(min-width:821px){.side{position:sticky;top:0;height:100vh}}
.brand{font-size:1.15rem;font-weight:600;line-height:1.2;color:#fff;padding:0 .5rem}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{color:inherit;text-decoration:none;padding:.55rem .75rem;border-radius:6px}
.side nav a:hover{background:rgba(255,255,255,.08)}
.side nav a.on{background:#fff;color:#0e3b3f;font-weight:600}
.theme{margin-top:auto;font:inherit;font-size:.85rem;background:none;border:1px solid rgba(255,255,255,.3);color:inherit;border-radius:6px;padding:.4rem .7rem;cursor:pointer}
.main{padding:1.75rem 2rem 3rem;min-width:0}
h1{font-size:1.5rem;margin:0;font-weight:600}
h2{font-size:1.05rem;margin:0 0 .75rem;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.head>div{display:flex;gap:.6rem;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.25rem}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.85rem;color:var(--mut);padding:.5rem .75rem;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:.65rem .75rem;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hov)}
tr.nx{background:var(--soft)}
.act{white-space:nowrap;text-align:right}
.mut{color:var(--mut)}
.tag{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.8rem;border:1px solid var(--brand);color:var(--brand)}
.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.bad{border-color:var(--bad);color:var(--bad)}
.btn{font:inherit;padding:.5rem 1rem;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.lk{font:inherit;background:none;border:0;color:var(--brand);cursor:pointer;padding:.2rem .4rem}
.lk:hover{text-decoration:underline}.lk.bad{color:var(--bad)}
input,select{font:inherit;padding:.5rem .65rem;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);width:100%}
input[type=search]{width:220px}
:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
dialog{border:0;border-radius:10px;padding:0;width:min(480px,calc(100vw - 2rem));background:var(--panel);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(5,30,32,.55)}
form{padding:1.4rem;display:flex;flex-direction:column;gap:.85rem}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.9rem;font-weight:500}
.fa{display:flex;justify-content:flex-end;gap:.5rem}
.err{color:var(--bad);margin:0;min-height:1.2em;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;padding:.6rem 1rem;border-radius:6px;display:none;z-index:9}

/* Dashboard */
.hero{background:linear-gradient(120deg,#0b3236 0%,#0f6b68 100%);color:#fff;border-radius:12px;padding:1.6rem 1.75rem;display:flex;justify-content:space-between;align-items:flex-end;gap:1.25rem;flex-wrap:wrap}
.hero .date{margin:0;opacity:.8;font-size:.9rem}
.hero h1{font-size:2rem;margin:.1rem 0 .4rem}
.hero .sum{margin:0;max-width:46ch;opacity:.95}
.qa{display:flex;gap:.6rem;flex-wrap:wrap}
.qa .btn{border-color:rgba(255,255,255,.55);background:transparent;color:#fff}
.qa .btn.w{background:#fff;color:#0e3b3f;border-color:#fff;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin:1rem 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:.9rem 1.1rem;text-decoration:none;color:inherit;display:block}
.kpi:hover{background:var(--hov)}
.kpi.b{border-left-color:var(--bad)}.kpi.o{border-left-color:var(--ok)}
.kpi span{color:var(--mut);font-size:.85rem}
.kpi b{display:block;font-size:1.9rem;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut)}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:1rem;margin-bottom:1rem}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.bars{display:flex;gap:.5rem;height:150px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;min-width:0}
.col{flex:1;width:100%;display:flex;align-items:flex-end}
.col i{display:block;width:100%;background:var(--soft);border-radius:4px 4px 0 0;min-height:3px}
.bar.t .col i{background:var(--brand)}
.bar span{font-size:.75rem;color:var(--mut)}
.bar b{font-size:.85rem}
.rw{display:grid;grid-template-columns:minmax(0,1fr) 90px 24px;gap:.6rem;align-items:center;margin:.55rem 0;font-size:.9rem}
.rw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--brand)}
.rw b{text-align:right}
.donw{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap}
.don{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bad) 0);position:relative;flex:none}
.don div{position:absolute;inset:20px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.don b{font-size:1.25rem}.don span{font-size:.75rem;color:var(--mut)}
.lg p{margin:.2rem 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.4rem}
.pl li{display:flex;justify-content:space-between;gap:.5rem;padding:.45rem 0;border-bottom:1px solid var(--line)}
.pl{list-style:none;margin:0;padding:0}.pl li:last-child{border:0}

/* Invoice (hidden on screen, shown when printing a bill) */
#invoice{display:none}
.inv{max-width:720px;margin:0 auto;color:#000;font-size:14px}
.inv h1{font-size:1.6rem}
.inv .ih{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:.8rem;margin-bottom:1rem}
.inv table{margin:1.2rem 0}
.inv th,.inv td{color:#000;border-bottom:1px solid #999;padding:.5rem .4rem}
.inv .r{text-align:right}
.inv .sig{margin-top:4rem;border-top:1px solid #000;width:220px;padding-top:.3rem}

@media(max-width:820px){.app{grid-template-columns:1fr}.side{padding:.75rem 1rem;gap:.5rem}.side nav{flex-direction:row;overflow-x:auto}.theme{margin:0}.main{padding:1.25rem 1rem 2rem}.g2{grid-template-columns:1fr}.hero h1{font-size:1.6rem}}
@media print{
  :root{color-scheme:light}
  body,.panel{background:#fff!important;color:#000!important}
  .side,.head>div,.qa,#toast{display:none!important}
  .app{display:block}.main{padding:0}
  .ls th:last-child,.ls td:last-child{display:none}
  body.pi .app{display:none}
  body.pi #invoice{display:block}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Hospital<br>Management</div>
    <nav id="nav"></nav>
    <button class="theme" id="themeBtn" data-a="theme"></button>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="invoice"></div>
<dialog id="dlg"><form id="fm"></form></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db;try{db=JSON.parse(localStorage.getItem('hms'))}catch(e){}
db=db||{patients:[],doctors:[],appointments:[],bills:[],n:1};
const save=()=>{try{localStorage.setItem('hms',JSON.stringify(db))}catch(e){}};
const nm=(t,id)=>(db[t].find(x=>x.id==id)||{}).name||'(deleted)';
const money=n=>'₹'+(+n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=s=>db.bills.filter(b=>b.status==s).reduce((t,b)=>t+ +b.amount,0);
const iso=d=>d.toLocaleDateString('en-CA');
const S=['Scheduled','Completed','Cancelled'];

/* Theme: light by default, dark on request */
let theme='light';try{theme=localStorage.getItem('hms-theme')||'light'}catch(e){}
document.documentElement.dataset.theme=theme;

const E={
patients:{t:'Patients',o:'patient',f:[['name','Full name','text',1],['age','Age','number',1],['gender','Gender','select',1,['Female','Male','Other']],['blood','Blood group','text'],['phone','Phone','text'],['address','Address','text']],c:['name','age','gender','blood','phone','address']},
doctors:{t:'Doctors',o:'doctor',f:[['name','Full name','text',1],['spec','Specialization','text',1],['days','Available days','text'],['phone','Phone','text'],['email','Email','email']],c:['name','spec','days','phone','email']},
appointments:{t:'Appointments',o:'appointment',f:[['patient','Patient','patients',1],['doctor','Doctor','doctors',1],['date','Date','date',1],['time','Time','time',1],['reason','Reason','text'],['status','Status','select',1,S]],c:['date','time','patient','doctor','reason','status']},
bills:{t:'Billing',o:'bill',f:[['patient','Patient','patients',1],['desc','Description','text',1],['amount','Amount (₹)','number',1]],c:['date','patient','desc','amount','status']}
};
const NAV=[['dashboard','dashboard','Dashboard'],['patients','patients','Patients'],['doctors','doctors','Doctors'],['appointments','appointments','Appointments'],['billing','bills','Billing']];
const view=()=>(NAV.find(n=>n[0]==location.hash.slice(1))||NAV[0])[1];
const hd=(t,k)=>(E[t].f.find(x=>x[0]==k)||[0,k=='date'?'Date':'Status'])[1];
function cell(t,r,k){
  const f=E[t].f.find(x=>x[0]==k)||[];let v=r[k];
  if(f[2]=='patients'||f[2]=='doctors')v=nm(f[2],v);
  if(k=='amount')return money(v);
  if(k=='status')return `<span class="tag ${v=='Paid'||v=='Completed'?'ok':v=='Unpaid'||v=='Cancelled'?'bad':''}">${esc(v)}</span>`;
  return esc(v);
}

function dash(){
  const now=new Date(),today=iso(now),hr=now.getHours();
  const greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const act=db.appointments.filter(a=>a.status!='Cancelled');
  const todayAll=db.appointments.filter(a=>a.date==today).sort((a,b)=>a.time.localeCompare(b.time));
  const todayN=todayAll.filter(a=>a.status!='Cancelled').length;
  const nowT=now.toTimeString().slice(0,5);
  const next=todayAll.find(a=>a.status=='Scheduled'&&a.time>=nowT);
  const unpaid=sum('Unpaid'),paid=sum('Paid'),tot=unpaid+paid,pct=tot?Math.round(paid/tot*100):0;
  const days=[...Array(7)].map((_,i)=>{const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),k=iso(d);return{l:i?d.toLocaleDateString('en-GB',{weekday:'short'}):'Today',n:act.filter(a=>a.date==k).length}});
  const mx=Math.max(1,...days.map(d=>d.n));
  const byDoc={};act.forEach(a=>byDoc[a.doctor]=(byDoc[a.doctor]||0)+1);
  const top=Object.entries(byDoc).sort((a,b)=>b[1]-a[1]).slice(0,5),tmx=top.length?top[0][1]:1;
  const recent=[...db.patients].reverse().slice(0,5);
  const sentence=(todayN?`${todayN} appointment${todayN>1?'s':''} today.`:'No appointments are booked for today.')
    +(next?` Next up at ${next.time}: ${esc(nm('patients',next.patient))} with ${esc(nm('doctors',next.doctor))}.`:'')
    +(unpaid>0?` ${money(unpaid)} in bills is still unpaid.`:'');
  return `<section class="hero">
    <div><p class="date">${now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><h1>${greet}</h1><p class="sum">${sentence}</p></div>
    <div class="qa"><button class="btn w" data-a="quick" data-t="appointments">Book appointment</button><button class="btn" data-a="quick" data-t="patients">Add patient</button><button class="btn" data-a="quick" data-t="bills">Create bill</button></div>
  </section>
  <div class="kpis">
    <a class="kpi" href="#patients"><span>Registered patients</span><b>${db.patients.length}</b></a>
    <a class="kpi" href="#doctors"><span>Doctors on staff</span><b>${db.doctors.length}</b></a>
    <a class="kpi" href="#appointments"><span>Appointments today</span><b>${todayN}</b></a>
    <a class="kpi b" href="#billing"><span>Unpaid bills</span><b>${money(unpaid)}</b></a>
  </div>
  <div class="g2">
    <section class="panel"><h2>Today’s queue</h2>`+(todayAll.length?`<div class="sc"><table><thead><tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Reason</th><th>Status</th></tr></thead><tbody>${todayAll.map(r=>`<tr class="${r===next?'nx':''}"><td>${esc(r.time)}</td><td>${esc(nm('patients',r.patient))}${r===next?' <span class="tag">Next up</span>':''}</td><td>${esc(nm('doctors',r.doctor))}</td><td>${esc(r.reason)}</td><td>${cell('appointments',r,'status')}</td></tr>`).join('')}</tbody></table></div>`:`<p class="mut">Nothing booked for today. Use Book appointment to add the first visit.</p>`)+`</section>
    <section class="panel"><h2>Bills collected</h2>`+(tot?`<div class="donw"><div class="don" style="--p:${pct}"><div><b>${pct}%</b><span>paid</span></div></div><div class="lg"><p><i style="background:var(--ok)"></i>Paid ${money(paid)}</p><p><i style="background:var(--bad)"></i>Unpaid ${money(unpaid)}</p></div></div>`:`<p class="mut">No bills yet. Create a bill to track payments here.</p>`)+`</section>
  </div>
  <div class="g3">
    <section class="panel"><h2>Appointments, next 7 days</h2><div class="bars">${days.map((d,i)=>`<div class="bar ${i?'':'t'}"><b>${d.n}</b><div class="col"><i style="height:${d.n/mx*100}%"></i></div><span>${d.l}</span></div>`).join('')}</div></section>
    <section class="panel"><h2>Busiest doctors</h2>`+(top.length?top.map(([id,n])=>`<div class="rw"><span>${esc(nm('doctors',id))}</span><div class="tr"><i style="width:${n/tmx*100}%"></i></div><b>${n}</b></div>`).join(''):`<p class="mut">Doctors appear here once appointments are booked.</p>`)+`</section>
    <section class="panel"><h2>Newest patients</h2>`+(recent.length?`<ul class="pl">${recent.map(p=>`<li><span>${esc(p.name)}</span><span class="mut">${esc(p.age)}, ${esc(p.gender)}</span></li>`).join('')}</ul>`:`<p class="mut">No patients registered yet.</p>`)+`</section>
  </div>`;
}

function list(t){
  const e=E[t],rows=[...db[t]].reverse();
  return `<div class="head"><h1>${e.t}</h1><div><input type="search" id="q" placeholder="Search ${e.t.toLowerCase()}" aria-label="Search ${e.t.toLowerCase()}">${t=='bills'?'<button class="btn" data-a="printlist">Print list</button>':''}<button class="btn p" data-a="add">Add ${e.o}</button></div></div><section class="panel">`+
  (rows.length?`<div class="sc"><table class="ls"><thead><tr>${e.c.map(k=>`<th>${hd(t,k)}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${e.c.map(k=>`<td>${cell(t,r,k)}</td>`).join('')}<td class="act">${t=='bills'?(r.status=='Unpaid'?`<button class="lk" data-a="pay" data-id="${r.id}">Mark paid</button>`:'')+`<button class="lk" data-a="invoice" data-id="${r.id}">Print invoice</button>`:`<button class="lk" data-a="edit" data-id="${r.id}">Edit</button>`}<button class="lk bad" data-a="del" data-id="${r.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:`<p class="mut">No ${e.t.toLowerCase()} yet. Add the first ${e.o} to get started.</p>`)+`</section>`;
}

function render(){
  const v=view();
  $('#nav').innerHTML=NAV.map(([h,k,l])=>`<a href="#${h}" class="${k==v?'on':''}">${l}</a>`).join('');
  $('#themeBtn').textContent=document.documentElement.dataset.theme=='dark'?'Switch to light theme':'Switch to dark theme';
  $('#main').innerHTML=v=='dashboard'?dash():list(v);
  document.title=NAV.find(n=>n[1]==v)[2]+' · Hospital Management';
  const q=$('#q');
  if(q)q.oninput=()=>{const s=q.value.toLowerCase().trim();document.querySelectorAll('tbody tr').forEach(tr=>tr.hidden=s&&!tr.textContent.toLowerCase().includes(s))};
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}

function printInvoice(id){
  const b=db.bills.find(x=>x.id==id);if(!b)return;
  const p=db.patients.find(x=>x.id==b.patient)||{};
  const d=new Date(b.date||iso(new Date())+'T00:00:00');
  $('#invoice').innerHTML=`<div class="inv">
    <div class="ih"><div><h1>Hospital Management</h1><div>Patient invoice</div></div><div class="r"><b>Invoice #${String(b.id).padStart(4,'0')}</b><br>${(isNaN(d)?new Date():d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div></div>
    <div><b>Billed to</b><br>${esc(p.name||'(deleted patient)')}<br>${p.age!==undefined?`Age ${esc(p.age)}, ${esc(p.gender)}<br>`:''}${esc(p.phone)}</div>
    <table><thead><tr><th>Description</th><th class="r">Amount</th></tr></thead><tbody><tr><td>${esc(b.desc)}</td><td class="r">${money(b.amount)}</td></tr></tbody><tfoot><tr><th>Total</th><th class="r">${money(b.amount)}</th></tr></tfoot></table>
    <p>Payment status: <b>${esc(b.status)}</b></p>
    <div class="sig">Authorised signature</div></div>`;
  document.body.classList.add('pi');
  window.print();
}
window.addEventListener('afterprint',()=>document.body.classList.remove('pi'));

function openForm(t,id){
  const e=E[t],r=id?db[t].find(x=>x.id==id):{};
  for(const f of e.f)if((f[2]=='patients'||f[2]=='doctors')&&!db[f[2]].length)return toast(`Add a ${f[2]=='patients'?'patient':'doctor'} first.`);
  const fm=$('#fm');fm.dataset.t=t;fm.dataset.id=id||'';
  fm.innerHTML=`<h2>${id?'Edit':'Add'} ${e.o}</h2>`+e.f.map(([k,l,ty,req,op])=>{
    const v=r[k]??'';let inp;
    if(ty=='select')inp=`<select name="${k}">${op.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(ty=='patients'||ty=='doctors')inp=`<select name="${k}" required><option value="">Select</option>${db[ty].map(x=>`<option value="${x.id}" ${x.id==v?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`;
    else inp=`<input name="${k}" type="${ty}" value="${esc(v)}" ${req?'required':''} ${ty=='number'?(k=='age'?'min="0" max="120"':'min="0.01" step="0.01"'):''}>`;
    return `<label>${l}${inp}</label>`}).join('')+
  `<p class="err" id="err" role="alert"></p><div class="fa"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn p">Save ${e.o}</button></div>`;
  $('#dlg').showModal();
}
$('#fm').onsubmit=ev=>{
  ev.preventDefault();
  const fm=ev.target,t=fm.dataset.t,id=fm.dataset.id,d=Object.fromEntries(new FormData(fm));
  if(d.name)d.name=d.name.trim();
  if(t=='appointments'&&d.status!='Cancelled'&&db.appointments.some(a=>a.id!=id&&a.doctor==d.doctor&&a.date==d.date&&a.time==d.time&&a.status!='Cancelled'))
    return $('#err').textContent='That doctor already has an appointment at this time. Pick another slot.';
  if(id)Object.assign(db[t].find(x=>x.id==id),d);
  else db[t].push({id:db.n++,...(t=='bills'?{status:'Unpaid',date:iso(new Date())}:{}),...d});
  save();$('#dlg').close();render();toast('Saved.');
};
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,v=view();
  if(a=='add')openForm(v);
  else if(a=='quick')openForm(b.dataset.t);
  else if(a=='edit')openForm(v,id);
  else if(a=='close')$('#dlg').close();
  else if(a=='invoice')printInvoice(id);
  else if(a=='printlist')window.print();
  else if(a=='theme'){theme=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('hms-theme',theme)}catch(e){}render()}
  else if(a=='pay'){db.bills.find(x=>x.id==id).status='Paid';save();render();toast('Bill marked as paid.')}
  else if(a=='del'&&confirm('Delete this record? Related appointments and bills are deleted too.')){
    db[v]=db[v].filter(x=>x.id!=id);
    if(v=='patients'){db.appointments=db.appointments.filter(x=>x.patient!=id);db.bills=db.bills.filter(x=>x.patient!=id)}
    if(v=='doctors')db.appointments=db.appointments.filter(x=>x.doctor!=id);
    save();render();toast('Deleted.');
  }
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
